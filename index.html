<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ==== Primary meta ==== -->
  <title>a16z 科技大點子圖鑑 · Big Ideas Explorer</title>
  <meta name="description" content="Andreessen Horowitz 的 96 個科技大點子(2025 與 2026),可依年份、團隊分類搜尋與篩選。中英文全頁切換。" />
  <link rel="canonical" href="https://tingwei161803.github.io/a16z-big-ideas/" />
  <meta name="theme-color" content="#6750A4" />

  <!-- ==== Open Graph ==== -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="a16z 科技大點子圖鑑 · Big Ideas Explorer" />
  <meta property="og:description" content="Andreessen Horowitz 的 96 個科技大點子(2025 與 2026),可搜尋、篩選、中英切換。" />
  <meta property="og:url" content="https://tingwei161803.github.io/a16z-big-ideas/" />

  <!-- ==== Twitter ==== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="a16z 科技大點子圖鑑 · Big Ideas Explorer" />
  <meta name="twitter:description" content="Andreessen Horowitz 的 96 個科技大點子(2025 與 2026)。" />

  <!-- ==== JSON-LD structured data ==== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "a16z Big Ideas Explorer",
    "description": "96 big ideas in tech from Andreessen Horowitz for 2025 and 2026.",
    "url": "https://tingwei161803.github.io/a16z-big-ideas/"
  }
  </script>

  <!-- ==== Fonts + icons (CDN, no local files) ==== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- ==== App bar ==== -->
  <header class="appbar">
    <div class="appbar__inner">
      <a class="brand" href="#">
        <span class="material-symbols-rounded brand__logo">lightbulb</span>
        <span class="brand__text">
          <span class="brand__name" data-i18n="brand">a16z 科技大點子圖鑑</span>
          <span class="brand__sub" data-i18n="brandSub">96 個科技預測 · 2025 &amp; 2026</span>
        </span>
      </a>

      <div class="appbar__actions">
        <a class="gh-star" id="ghStar" href="https://github.com/tingwei161803/a16z-big-ideas" target="_blank" rel="noopener"
           data-repo="tingwei161803/a16z-big-ideas" aria-label="GitHub repo">
          <span class="material-symbols-rounded">star</span>
          <span class="gh-star__label">Star</span>
          <span class="gh-star__count" id="ghStarCount">—</span>
        </a>

        <button class="icon-btn" id="langToggle" type="button"
                title="Language" aria-label="切換語言 / Toggle language">
          <span class="material-symbols-rounded">translate</span>
          <span class="icon-btn__txt" id="langLabel">EN</span>
        </button>

        <button class="icon-btn" id="themeToggle" type="button"
                title="Theme" aria-label="切換深淺色 / Toggle theme">
          <span class="material-symbols-rounded" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==== Controls: search + year + category chips ==== -->
  <section class="controls">
    <div class="controls__inner">
      <div class="controls__row">
        <div class="search">
          <span class="material-symbols-rounded search__icon">search</span>
          <input class="search__input" id="searchInput" type="search"
                 autocomplete="off" aria-label="搜尋 / Search"
                 data-i18n-attr="placeholder" data-i18n="search"
                 placeholder="搜尋大點子、作者、關鍵字…" />
        </div>
        <div class="seg" id="yearSeg" role="group" aria-label="Year"></div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
    </div>
  </section>

  <!-- ==== Card grid ==== -->
  <main class="grid" id="grid" aria-live="polite"></main>

  <!-- Empty state -->
  <p class="empty" id="empty" hidden data-i18n="empty">沒有符合的結果。</p>

  <!-- ==== Detail dialog ==== -->
  <dialog class="dialog" id="dialog">
    <div class="dialog__bar">
      <button class="icon-btn" id="navPrev" type="button" aria-label="上一個 / Previous">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>
      <button class="icon-btn" id="navNext" type="button" aria-label="下一個 / Next">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
      <span class="dialog__spacer"></span>
      <button class="icon-btn" id="dialogClose" type="button" aria-label="關閉 / Close">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <div class="dialog__body" id="dialogBody"></div>
  </dialog>

  <!-- ==== Footer ==== -->
  <footer class="footer">
    <p data-i18n-html="footer">
      內容整理、翻譯自 <a href="https://a16z.com/big-ideas-in-tech-2025/" target="_blank" rel="noopener">a16z Big Ideas in Tech 2025</a>
      與 <a href="https://a16z.com/newsletter/big-ideas-2026-part-1/" target="_blank" rel="noopener">Big Ideas 2026</a>。本站為非官方整理。
    </p>
  </footer>

  <!-- ==== Scripts (order matters: data first) ==== -->
  <script src="data/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
